name: Cahier des charges — rollback

# Make an archived version of the cahier des charges the current one again
# (home page + fixed download links). Nothing is deleted: run it again with
# the newer version to roll forward.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to make current (e.g. V1.0)"
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Roll back
        env:
          VERSION: ${{ inputs.version }}
        run: node tools/cahier.mjs rollback "$VERSION"
      - name: Commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cahier
          git commit -m "Cahier des charges: $VERSION is the current version again" || echo "nothing to change"
          git push
